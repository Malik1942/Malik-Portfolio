<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/x-icon" href="/favicon.jpeg">
    <link rel="apple-touch-icon" href="/favicon.jpeg" />
    <!-- crossorigin on Fontshare needed for cross-origin font requests -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- General Sans (display + body) is self-hosted via @font-face in src/index.css:
         Fontshare's CDN serves an empty "restricted" stylesheet to localhost referers,
         which silently swapped the whole site to Helvetica in local dev.
         Preload the two weights the first paint uses so text renders in the real face
         immediately; the rest arrive via the cascade. -->
    <link rel="preload" href="/fonts/general-sans/GeneralSans-Regular.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/general-sans/GeneralSans-Light.woff2" as="font" type="font/woff2" crossorigin>
    <!-- Keep this render-blocking: the loading screen covers the page while it loads,
         and document.fonts.ready (used by the loading screen AND DotGrid) only sees
         fonts already in the stylesheet cascade — async loading would cause
         fonts.ready to resolve before Space Grotesk is in the queue. -->
    <!-- JetBrains Mono (mono) + Space Grotesk (orb labels in DotGrid) + Inter (particle name cluster) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@700&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
    <title>Malik Zhang – Product Designer | Seattle | UW MHCI+D</title>
    <meta name="description" content="AI-native product designer. I find the real problem, decide where AI belongs, and build it end to end. Seattle, UW MHCI+D.">
    <meta name="author" content="Malik Zhang" />
    <link rel="canonical" href="https://www.malikzhang.com/">

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Malik Zhang – Product Designer | Seattle | UW MHCI+D">
    <meta property="og:description" content="AI-native product designer. I find the real problem, decide where AI belongs, and build it end to end. Seattle, UW MHCI+D.">
    <meta property="og:url" content="https://www.malikzhang.com">
    <meta property="og:image" content="https://www.malikzhang.com/og-image.png">

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Malik Zhang – Product Designer | Seattle | UW MHCI+D">
    <meta name="twitter:description" content="AI-native product designer. I find the real problem, decide where AI belongs, and build it end to end. Seattle, UW MHCI+D.">
    <meta name="twitter:image" content="https://www.malikzhang.com/og-image.png">

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "name": "Malik Zhang",
      "jobTitle": "Product Designer",
      "url": "https://www.malikzhang.com",
      "sameAs": [
        "https://www.linkedin.com/in/malik-zhang"
      ],
      "alumniOf": {
        "@type": "CollegeOrUniversity",
        "name": "University of Washington (MHCI+D)"
      },
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Seattle",
        "addressRegion": "WA",
        "addressCountry": "US"
      }
    }
    </script>
</head>

  <body>
    <!-- Loading screen: shown before JS runs, dismissed by main.tsx once
         React has rendered and fonts are ready. Background matches --background. -->
    <div id="loading-screen" style="
      position: fixed;
      inset: 0;
      z-index: 99999;
      background: #0a0a0a;
      transition: opacity 0.45s ease;
    "></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
