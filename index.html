<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/x-icon" href="/favicon.jpeg">
    <link rel="apple-touch-icon" href="/favicon.jpeg" />
    <!-- Every web font is self-hosted from /fonts and declared via @font-face in
         src/index.css (General Sans: Fontshare's CDN serves an empty "restricted"
         stylesheet to localhost referers; Inter / Space Grotesk / JetBrains Mono:
         the Google Fonts stylesheet was render-blocking and cost a second origin's
         connection before document.fonts.ready — which gates the loading screen —
         could resolve). Keeping the rules in the main stylesheet is deliberate:
         fonts.ready only sees fonts already in the cascade.
         Preload the faces the first paint renders (General Sans Light/Regular for
         copy, Medium/Semibold for nav + headings — the same four the browser
         requests the moment React paints) plus Space Grotesk, which the hero canvas
         draws its orb labels in as soon as the loading screen lifts. -->
    <link rel="preload" href="/fonts/general-sans/GeneralSans-Regular.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/general-sans/GeneralSans-Light.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/general-sans/GeneralSans-Medium.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/general-sans/GeneralSans-Semibold.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/space-grotesk/SpaceGrotesk-Variable-latin.woff2" as="font" type="font/woff2" crossorigin>
    <title>Malik Zhang – Product Designer | Seattle | UW MHCI+D</title>
    <meta name="description" content="AI-native product designer. I find the real problem, decide where AI belongs, and build it end to end. Seattle, UW MHCI+D.">
    <meta name="author" content="Malik Zhang" />
    <link rel="canonical" href="https://www.malikzhang.com/">

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Malik Zhang – Product Designer | Seattle | UW MHCI+D">
    <meta property="og:description" content="AI-native product designer. I find the real problem, decide where AI belongs, and build it end to end. Seattle, UW MHCI+D.">
    <meta property="og:url" content="https://www.malikzhang.com">
    <meta property="og:image" content="https://www.malikzhang.com/og-image.png">

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Malik Zhang – Product Designer | Seattle | UW MHCI+D">
    <meta name="twitter:description" content="AI-native product designer. I find the real problem, decide where AI belongs, and build it end to end. Seattle, UW MHCI+D.">
    <meta name="twitter:image" content="https://www.malikzhang.com/og-image.png">

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "name": "Malik Zhang",
      "jobTitle": "Product Designer",
      "url": "https://www.malikzhang.com",
      "sameAs": [
        "https://www.linkedin.com/in/malik-zhang"
      ],
      "alumniOf": {

        "name": "University of Washington (MHCI+D)"
      },

        "addressLocality": "Seattle",

      }
    }
    </script>
</head>

  <body>
    <!-- Loading screen: shown before JS runs, dismissed by main.tsx once
         React has rendered and fonts are ready. Background matches --background. -->
    <div id="loading-screen" style="
      position: fixed;
      inset: 0;
      z-index: 99999;
      background: #0a0a0a;
      transition: opacity 0.45s ease;
    "></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Google tag (gtag.js). Queued immediately (so nothing is lost) but the
         170 kB library itself is only fetched after the page has loaded — it used
         to be the very first request in <head>, competing with fonts and the app
         bundle for bandwidth during the phase the loading screen is waiting on. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-TXP8CJ15J0');
      addEventListener('load', function () {
        var s = document.createElement('script');
        s.async = true;
        s.src = 'https://www.googletagmanager.com/gtag/js?id=G-TXP8CJ15J0';
        document.head.appendChild(s);
      });
    </script>
  </body>
</html>
